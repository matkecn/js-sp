<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Ex4</title>
</head>
<body>
    <style>
        .box {
            background-color: blue;
            border: 1px solid blue;
            border-radius: 20px;
            width: 50px;
            height: 50px;
            display: block;
        }
    </style>
    <div class="box"></div>
    <script>
        var box = $('.box');
        $(document).ready(function () {
            $(box).on('mouseenter', function () {
                $(this).animate({
                    width: "100px",
                    height: "100px"
                }, 900)
            });

            $(box).on('mouseleave', function () {
                $(this).animate({
                    width: "50px",
                    height: "50px"
                }, 900)
            });
        });
    </script>
</body>
</html>
